name: release

# Attaches ready-to-run binaries to a GitHub Release.
#
# Triggered by pushing a version tag (vX.Y.Z). For each target it builds with
# the release profile, smoke-tests the binary (it must run and print its own
# version), packs it with a SHA256, and a final job attaches everything to the
# Release along with one combined checksum file.
#
# WHY A SEPARATE WORKFLOW rather than a step in ci.yml: ci.yml runs on every
# push and PR, and building 5 release binaries on each wastes runner minutes on
# artifacts nobody downloads. Releases are rare and the artifacts are the point.
#
# WHY THE TAG IS CHECKED against Cargo.toml before anything is built: a tag that
# disagrees with the manifest produces a binary whose `--version` lies, and the
# PE version resource (crates/quant-cli/build.rs) is stamped from
# CARGO_PKG_VERSION, so Explorer's Details tab would show the wrong number too.
# Failing loudly beats shipping that.
#
# Each target builds on a runner of its OWN architecture, so nothing is cross
# compiled. That matters for two reasons: an aarch64 Linux binary produced by
# cross-compiling needs an aarch64 linker, and the smoke test below can
# actually RUN every artifact instead of merely inspecting its header.
#
# This workflow deliberately has no `pull_request` trigger: a fork's PR must
# never be granted `contents: write`. It only ever runs for a tag you pushed.

on:
  push:
    tags:
      - "v*"
  # Manual re-run. Two reasons this exists:
  #   1. A failed run can be retried WITHOUT rewriting a published tag.
  #      GitHub executes the workflow file as it exists AT THE TAG, so a fix
  #      committed to main is invisible to a re-run of that run — "Re-run
  #      failed jobs" would fail identically forever. This trigger runs the
  #      file from the branch you choose instead.
  #   2. Re-uploading assets to an existing release without a new build.
  #
  # Leave `tag` empty to build the ref you are looking at. Set it to re-attach
  # to an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/attach (blank = use the selected ref)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail before burning 5 runner-minutes on a mistyped tag.
  verify-tag:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      # BARE manifest version, e.g. `0.3.1`. This is what the binary's own
      # `--version` prints (`quantui-rs 0.3.1`), so the smoke test greps for
      # this. Do NOT "simplify" it by dropping the other output and using this
      # everywhere — see `tag` below.
      version: ${{ steps.check.outputs.version }}
      # FULL tag including the `v`, e.g. `v0.3.1`. This is the ONLY correct
      # value to hand to git or `gh release`, because it is the name the ref
      # actually has in refs/tags/.
      #
      # WHY BOTH EXIST, since this has already caused a bad release: they are
      # not interchangeable. `gh release view 0.3.1` does not find the release
      # published on tag `v0.3.1`, so the attach job's "does the release
      # already exist?" guard fell through to `gh release create 0.3.1`. That
      # did not error — `gh release create` CREATES the tag when it is missing,
      # pointing it at the default branch's HEAD — so it silently published a
      # second release, on a bare tag, carrying all six assets. Two releases
      # then both read as v0.3.1 to a human, because the create path re-added
      # the `v` to the title while the tag had it stripped. That shipped on
      # both 0.3.0 and 0.3.1 before it was noticed.
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a manual run the ref is a branch, which may be ahead of the tag.
          # Check out the tag when one was named, so the built binary really
          # corresponds to the released commit.
          ref: ${{ inputs.tag || github.ref }}
      - id: check
        env:
          # inputs.tag is only populated for workflow_dispatch; on a tag push
          # GITHUB_REF_NAME is the tag. Prefer whichever is present.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag  cargo=$manifest"
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $manifest"
            echo "Retag, or bump Cargo.toml and commit before tagging."
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          # Published alongside `version`, not instead of it: the binary prints
          # the bare version, but every git/gh ref operation needs the tag.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: verify-tag
    # One failing target must not hide the others' results.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is STATIC (musl) on purpose. A glibc-linked build from
          # ubuntu-24.04 (glibc 2.39) refuses to start on an older distro, which
          # is the single most common "the download is broken" report for a
          # Rust CLI. musl has no runtime dependency at all.
          #
          # Both archs use NATIVE runners (free for public repos), so the
          # smoke test below runs the real binary. ubuntu-latest is x86_64;
          # there is no ubuntu-latest-arm alias, the ARM label is spelled out.
          - name: linux-x86_64 (static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - name: linux-aarch64 (static)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          # Windows gets a .zip because that is what Explorer expects; a .tar.gz
          # is an extra manual step on the platform most users are on.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # macos-latest is ARM64 (Apple Silicon) as of macOS 26. The Intel
          # build needs an explicit -intel label, or the job silently ships a
          # second ARM binary under an x86_64 file name.
          - name: macos-aarch64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x86_64 (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Must match verify-tag: on a manual run, build the TAG's source, not
          # the branch's. Otherwise a re-attach would ship binaries built from
          # commits that were never part of the release.
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/quantui-rs"
          # `-f`, not `-x`: Git Bash does not always report a freshly written
          # .exe as executable, and a false negative here would fail the release
          # for no reason.
          [ -f "$bin" ] || bin="$bin.exe"
          test -f "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          # Runs on EVERY target because each has a native runner of its own
          # architecture. A binary that cannot print its own version, or prints
          # the wrong one, must not reach a Release.
          got="$("$bin" --version)"
          echo "$got"
          echo "$got" | grep -q "${{ needs.verify-tag.outputs.version }}" \
            || { echo "::error::binary reports '$got' but the tag is ${{ needs.verify-tag.outputs.version }}"; exit 1; }
          # And it must actually work, not merely start.
          "$bin" --help > /dev/null
          wc -c < "$bin"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.verify-tag.outputs.version }}"
          stem="quantui-rs-$ver-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/quantui-rs"
          [ -f "$bin" ] || bin="$bin.exe"

          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # `zip` is NOT installed on windows-latest and neither is 7z, but
            # the runner's bundled Python is. zipfile needs no install and
            # behaves identically on all three runner images. The heredoc is
            # quoted so the SHELL expands $stem and Python does not.
            cp "$bin" "${stem}.exe"
            STEM="$stem" python - <<'PY'
          import os, zipfile
          stem = os.environ["STEM"]
          with zipfile.ZipFile(f"dist/{stem}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.write(f"{stem}.exe", f"{stem}.exe")
          PY
            rm -f "${stem}.exe"
          else
            cp "$bin" "$stem"
            # Reproducible archive, built with Python rather than tar(1).
            #
            # `gzip -n` alone is NOT enough, and this was measured: two runs of
            # `tar | gzip -n` produced different SHA256s because tar embeds the
            # file's mtime plus uid/gid/uname. GNU tar's `--sort/--owner/--mtime`
            # would fix it but bsdtar (macOS) rejects those flags, so the two
            # runners would disagree.
            #
            # tarfile is byte-identical on all three runner images and lets every
            # volatile field be pinned: mtime 0, uid/gid 0, empty uname/gname,
            # mode 0755. Same commit in, same bytes out.
            STEM="$stem" SRC="$bin" python - <<'PY'
          import os, tarfile, gzip
          stem, src = os.environ["STEM"], os.environ["SRC"]
          with open(f"dist/{stem}.tar.gz", "wb") as raw:
              # mtime=0 in the gzip header too, so the OUTER file is stable.
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as gz:
                  with tarfile.open(fileobj=gz, mode="w") as tar:
                      info = tar.gettarinfo(src, arcname=stem)
                      info.mtime = 0
                      info.uid = info.gid = 0
                      info.uname = info.gname = ""
                      info.mode = 0o755
                      with open(src, "rb") as fh:
                          tar.addfile(info, fh)
          PY
          rm -f "$stem"
          fi
          ls -la dist/

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # `sha256sum *` alone records a leading "./" on some coreutils
          # versions; strip it so the manifest reads cleanly and
          # `sha256sum -c SHA256SUMS.txt` works from any directory.
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            sha256sum "$f"
          done | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          # Deliberately 90 days, not 7. These artifacts are the ONLY copy of
          # the binaries: if the attach step fails, re-running it recovers the
          # exact archives instead of rebuilding all five. 7 days is not enough
          # window if a human is asleep at the wrong moment.
          retention-days: 90

  attach:
    name: Attach to GitHub Release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    steps:
      # The `gh` CLI resolves which repository to upload to from the git
      # remote, so it needs a real checkout. Without this it aborts with
      # "failed to run git: fatal: not a git repository" and the archives never
      # reach the Release — after five successful builds, which is the most
      # expensive place to fail. The checkout costs about a second.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all
          # merge-multiple:false gives each job its own directory. Flattening
          # would be fine here (the file names embed the target and are unique)
          # but per-job dirs keep the provenance visible if a step ever changes.
          merge-multiple: false

      - name: Collect and build one checksum manifest
        run: |
          set -euo pipefail
          mkdir -p out
          # Drop the per-job manifests; one combined file is what a user needs.
          find all -name 'SHA256SUMS.txt' -delete
          find all -type f -exec mv {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # The FULL `v`-prefixed tag (`v0.3.1`), NOT the bare manifest version.
          # Every command below addresses a REF in refs/tags/, and that ref is
          # named `v0.3.1`. Passing `0.3.1` here silently produced a duplicate
          # release — see the note on verify-tag's `tag` output.
          TAG: ${{ needs.verify-tag.outputs.tag }}
          # Bare version (`0.3.1`), used ONLY to build the human-readable
          # release title. Kept separate so the title cannot ever be assembled
          # by concatenating a literal `v` onto something that already has one.
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          notes="RELEASE_NOTES.md"

          # The tag MUST already exist before we are allowed to create a
          # release for it. `gh release create` treats a nonexistent tag as an
          # instruction to CREATE one, pointed at the default branch's HEAD —
          # not at the commit you just built and smoke-tested. That is the
          # actual mechanism behind the duplicate releases: no error, a
          # plausible-looking release, and a stray tag on the wrong commit.
          # Refusing here turns a silently wrong artifact into a loud failure,
          # which is the same philosophy as verify-tag above.
          #
          # `--exit-code` is what makes a miss detectable; without it ls-remote
          # exits 0 on no match and prints nothing.
          #
          # This is the SECOND of two independent guards, not the only one.
          # verify-tag already refuses any tag that is not exactly
          # `v$manifest`, which is what rejects a bare `0.3.1`. This one
          # catches the case verify-tag cannot see: a ref that was never
          # pushed at all. Note the two are not redundant — once the stray
          # bare tags exist, a bare name WOULD pass this check, because the
          # ref genuinely exists. So do not weaken verify-tag on the
          # assumption that this guard covers it.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG does not exist on the remote"
            echo "Refusing to create a release: gh release create would auto-create"
            echo "the tag at the default branch HEAD, not at the release commit."
            echo "Push the tag first:  git tag $TAG <commit> && git push origin $TAG"
            exit 1
          fi
          # Echo the ref we resolved, so the run log records exactly which
          # commit the release will point at.
          echo "Confirmed remote tag: $(git ls-remote --tags origin "refs/tags/$TAG")"

          # Idempotent: re-running after editing the notes uploads to the
          # existing Release instead of failing on "already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # Title comes from the BARE version, so the `v` appears exactly once
            # whether the tag is `v0.3.1`. Deriving it from $TAG instead would
            # render "quantui-rs vv0.3.1".
            args=(--title "quantui-rs v$VERSION" --generate-notes)
            # A committed RELEASE_NOTES.md, if present, wins over the
            # auto-generated commit list.
            [ -f "$notes" ] && args+=(--notes-file "$notes")
            gh release create "$TAG" out/* "${args[@]}"
          fi
          gh release view "$TAG" --json url,assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'