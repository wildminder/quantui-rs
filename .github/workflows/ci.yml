name: ci

on:
  push:
    branches: [main]
  pull_request:

# Phase 11.3: full regression + golden byte-parity on both Windows and Linux.
# The golden fixtures (tests/golden/**) are committed and marked binary in
# .gitattributes so byte-compare parity tests are valid on every OS.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (incl. golden byte-parity)
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Report release binary size
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ls -la target/release/quantui-rs.exe
          else
            ls -la target/release/quantui-rs
          fi
