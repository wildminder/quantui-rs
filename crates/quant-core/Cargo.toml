[package]
name = "quant-core"
version.workspace = true
edition.workspace = true
description = "Core library: safetensors IO, INT8/FP8/MXFP8/NVFP4 quantization kernels, manifests"
license = "MIT"

[lints]
workspace = true

[dependencies]
thiserror = "2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
half = "2"
regex = "1"
rayon = "1"
sha2 = "0.10"
# Phase 10: GGUF v3 writer + GGML quant encoders. Pinned exactly — young crate
# with API churn risk (plan §6 risk register); GGUF phase is isolated.
rlx-gguf = "=0.2.14"

[dev-dependencies]
safetensors = "0.6"
tempfile = "3"
# Phase 10 E2E tests read the GGUF output back through the crate's own parser.
rlx-gguf = "=0.2.14"
half = "2"
# Phase 11.1: throughput benchmark (GB/s) of the streaming quantizer.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "stream_throughput"
harness = false
