[package]
name = "quant-core"
version.workspace = true
edition.workspace = true
description = "Core library: safetensors IO, INT8/FP8/MXFP8/NVFP4 quantization kernels, manifests"
license = "MIT"

[dependencies]
thiserror = "2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
half = "2"
regex = "1"
rayon = "1"
sha2 = "0.10"

[dev-dependencies]
safetensors = "0.6"
tempfile = "3"
