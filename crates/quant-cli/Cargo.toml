[package]
name = "quant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "quantui-rs: standalone CLI for safetensors -> ComfyUI/GGUF quantization"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "quantui-rs"
path = "src/main.rs"

[dependencies]
quant-core = { version = "0.1.0", path = "../quant-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3"
# Phase 10 CLI tests build a tiny HF fixture + read the GGUF output back.
half = "2"
rlx-gguf = "=0.2.14"
