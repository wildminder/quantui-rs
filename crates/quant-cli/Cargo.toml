[package]
name = "quant-cli"
version.workspace = true
edition.workspace = true
description = "quantui-rs: standalone CLI for safetensors -> ComfyUI/GGUF quantization"
license = "MIT"

[[bin]]
name = "quantui-rs"
path = "src/main.rs"

[dependencies]
quant-core = { path = "../quant-core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3"
