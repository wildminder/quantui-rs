<?xml version="1.0" encoding="UTF-8"?>
<!--
  quantui-rs app icon — the funnel.

  Design intent — "many weights, few buckets": a fine lattice of small cells on
  the left narrows through a wedge into a few large blocks on the right. That is
  quantization stated literally: N values collapse onto M levels. The wedge is
  the projection; the coarse blocks are the codebook.

  Origin: docs/misc/app-icon.svg, supplied as a single 74-subpath #da8346 blob
  with no viewBox and no size. It was a 589.91 x 340.68 LANDSCAPE mark
  (aspect 1.73), which cannot be dropped into a square Windows icon canvas
  without letterboxing it to a stamp, so it was re-composed here rather than
  pasted: uniformly scaled to 424x245, centred on a 512 square with a 44-unit
  margin, and set on the same near-black plate as before so the orange reads on
  a light taskbar. Geometry is otherwise the source's own — the wedge and all 73
  cells keep their proportions exactly.

  Read at 16px the fine lattice necessarily mushes (a cell is 1.5% of the
  width), but the SILHOUETTE — narrow waist, flare to a solid right block —
  still carries, which is what a taskbar actually shows.

  This file is the SOURCE. assets/icon.ico is generated from it by
  tools/gen_icon.py — edit the SVG, then regenerate; never hand-edit the .ico.
  The generator reads the rects and the wedge from THIS file, so they cannot
  drift apart.
-->
